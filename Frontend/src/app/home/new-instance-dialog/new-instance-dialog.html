<h2 mat-dialog-title>Create New Instance</h2>
<mat-dialog-content>
  <instance-config
    [clientMods]="clientMods"
    [serverMods]="serverMods"
    [customMessages]="customMessages"
    [id]="id"
    [serverFolder]="serverFolder"
    [hostName]="hostName"
    [missionName]="missionName"
    [vanillaMissionName]="vanillaMissionName"
    [missionTemplateName]="missionTemplateName"
    [serverConfigName]="serverConfigName"
    [profileName]="profileName"
    [steamPort]="steamPort"
    [serverPort]="serverPort"
    [steamQueryPort]="steamQueryPort"
    [rConPort]="rConPort"
    [rConPassword]="rConPassword"
    [cpuCount]="cpuCount"
    [noFilePatching]="noFilePatching"
    [doLogs]="doLogs"
    [adminLog]="adminLog"
    [freezeCheck]="freezeCheck"
    [netLog]="netLog"
    [limitFPS]="limitFPS"
    [mapName]="mapName"
    [restartOnUpdate]="restartOnUpdate"
    [restartInterval]="restartInterval"
    [autoStartServer]="autoStartServer"
    [makeBackups]="makeBackups"
    [deleteBackups]="deleteBackups"
    [backupPath]="backupPath"
    [maxKeepTime]="maxKeepTime"/>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onCancelClick()">Cancel</button>
  <button matButton (click)="onOkClick()">Ok</button>
</mat-dialog-actions>
