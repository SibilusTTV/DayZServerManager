
<div style="display: flex; flex-direction: row; gap: 10px;">
  <button matIconButton (click)="onStartClick()"><mat-icon>play_arrow</mat-icon></button>
  <button matIconButton (click)="onStopClick()"><mat-icon>stop</mat-icon></button>
  <button matIconButton (click)="onRemoveClicked()"><mat-icon>delete</mat-icon></button>
</div>
<div style="display: flex; flex-direction: column;">

  <div style="display: flex; flex-direction: row; gap: 20px;">
    <mat-form-field style="height: 80px; width: 160px;">
      <mat-label>Manager Status</mat-label>
      <input matInput disabled [value]="serverInformation().managerStatus" style="color: black;"/>
    </mat-form-field>
    <mat-form-field style="height: 80px; width: 160px;">
      <mat-label>DayZ Server Status</mat-label>
      <input matInput disabled [value]="serverInformation().dayzServerStatus" style="color: black;"/>
    </mat-form-field>
    <mat-form-field style="height: 80px; width: 160px;">
      <mat-label>Player Count</mat-label>
      <input matInput disabled [value]="serverInformation().playersCount" style="color: black;"/>
    </mat-form-field>
  </div>
</div>

<h2>Players:</h2>
<div class="table-container-div">

  <ag-grid-angular
    [columnDefs]="ColDefs"
    [rowData]="serverInformation().players"
    style="width: 100%; flex: 1;"
  />
</div>
