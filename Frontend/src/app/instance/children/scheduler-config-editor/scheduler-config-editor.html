
<div style="display: flex; flex-direction: row;">
  <button mat-icon-button (click)="onSaveClick()" ><mat-icon>save</mat-icon></button>
  <button mat-icon-button (click)="LoadServerConfig()" ><mat-icon>autorenew</mat-icon></button>
</div>

<div style="display: flex; flex-direction: row; gap: 10px;">
  <mat-form-field style="height: 80px; width: 160px;">
    <mat-label>Timeout</mat-label>
    <input matInput type="number" max="24" min="1" [(ngModel)]="timeout"/>
  </mat-form-field>
  <mat-form-field style="height: 80px; width: 320px;">
    <mat-label>Filtered Nick Message</mat-label>
    <input matInput [(ngModel)]="filteredNickMessage"/>
  </mat-form-field>
  <mat-form-field style="height: 80px; width: 160px;">
    <mat-label>Restart On Update</mat-label>
    <mat-select [(ngModel)]="restartOnUpdate">
      <mat-option [value]="false">False</mat-option>
      <mat-option [value]="true">True</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field style="height: 80px; width: 160px;">
    <mat-label>Use Nick Filter</mat-label>
    <mat-select [(ngModel)]="useNickFilter">
      <mat-option [value]="false">False</mat-option>
      <mat-option [value]="true">True</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field style="height: 80px; width: 160px;">
    <mat-label>Restart Interval</mat-label>
    <input matInput type="number" [(ngModel)]="restartInterval"/>
    <mat-hint>In Hours</mat-hint>
  </mat-form-field>
</div>

<div class="table-container-div">
  <div style="display: flex; flex-direction: column; gap: 10px; flex: 2;">
    <div style="display: flex; flex-direction: row; gap: 40px; align-items: center;">
      <h3>Custom Messages</h3>
      <button mat-icon-button (click)="onAddCustomMessageClick()"><mat-icon>add</mat-icon></button>
    </div>
    <div class="table-container-div">
      <ag-grid-angular
        [columnDefs]="messageColDefs"
        [rowData]="customMessages()"
        [defaultColDef]="defaultColDef"
        class="full-width-grid"
        [stopEditingWhenCellsLoseFocus]="true"
        [rowDragManaged]="true"
        [rowHeight]="60"
        [autoSizeStrategy]="autoSizeStrategy"
        (dragStopped)="onMessageRowDragStopped($event)"
      />
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px; flex: 1;">
    <div style="display: flex; flex-direction: row; gap: 40px; align-items: center;">
      <h3>Bad Names</h3>
    </div>
    <div style="display: flex; flex-direction: row; gap: 40px; align-items: flex-start;">
      <mat-form-field style="height: 80px; width: 320px;">
        <mat-label>Bad Name</mat-label>
        <input matInput [(ngModel)]="badName"/>
      </mat-form-field>
      <div style="height: 60px; align-content: center;">
        <button mat-icon-button (click)="onAddBadName()"><mat-icon>add</mat-icon></button>
      </div>
    </div>
    <div class="table-container-div">
      <ag-grid-angular
        class="full-width-grid"
        [rowData]="badNames()"
        [columnDefs]="badNamesColDefs"
        [defaultColDef]="defaultColDef"
        [autoSizeStrategy]="autoSizeStrategy"
        />
    </div>
  </div>
</div>
